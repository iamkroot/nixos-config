# Centralized versions for container images, custom packages, and pinned derivations.
#
# Conventions:
# - Prefer to pin everything to exact versions/hashes/digests
# - Container fields: repository, tag (or suite-level version), digest (optional but RECOMMENDED OCI manifest digest).
# - Image derivations: when an OCI image specifies both `digest` and `hash`, it is pulled
#   via `dockerTools.pullImage` (e.g. to extract static assets).
#   - `digest`: OCI manifest/index hash (`sha256:...`) from the registry.
#   - `hash`: Nix SRI NAR hash (`sha256-...=`) for the fixed-output derivation.
# - Source fetchers: [<package>.src] dedicated sub-table for build-from-source derivations.
#   - `repository`: forge URI scheme (e.g. 'github:owner/repo', 'gitea:domain/owner/repo',
#     'codeberg:owner/repo', 'gitlab:[domain/]owner/repo', 'git:https://...').
#   - `rev`: Git commit hash or tag.
#   - `hash`: SRI hash for the fetched source repository.
#   - `forceFetchGit`: boolean flag (optional) for forge fetchers to force full git fetch.

