[env]
# WAR perm issues due to chroot trying to access system's ssh config
NIX_SSHOPTS = "-F {{env.HOME}}/.ssh/config"

[vars]
nix_chroot_bin = "nix-user-chroot {{env.HOME}}/.nix {{env.HOME}}/.nix-profile/bin"
nix_bin = '''{{vars.nix_chroot_bin}}/nix --option builders-use-substitutes true --option max-jobs auto --option cores 8 --extra-experimental-features nix-command --extra-experimental-features flakes '''

[tasks.fmt]
description = "Run nixfmt via nix-user-chroot"
run = "{{vars.nix_chroot_bin}}/nix-shell -p nixfmt-tree --run \"treefmt ${@:-.}\""

[tasks."dns:push-router"]
vars._.file = "secrets/mise_vars.txt"
description = "Push dnsmasq address entries to OpenWrt (derived from Nix)"
run = 'NIX_BIN="{{vars.nix_bin}}" ./tools/dns-push-router.sh "${@:-router}"'

[tasks."dns:sync-porkbun"]
vars._.file = "secrets/mise_vars.txt"
description = "Sync DNS records to Porkbun (derived from Nix)"
run = '''
eval "$(cd secrets && mise run decrypt-porkbun)"
NIX_BIN="{{vars.nix_bin}}" ./tools/dns-sync-porkbun.sh
'''

[tasks."secret:renc"]
alias = "renc"
description = "Run vaultix renc"
run = "{{vars.nix_bin}} run $'.?submodules=1#vaultix.app.x86_64-linux.renc'"

[tasks."secret:edit"]
alias = "sedit"
description = "Run vaultix renc"
run = "{{vars.nix_bin}} run $'.?submodules=1#vaultix.app.x86_64-linux.edit'"

[tasks.commit-secrets]
dir = "secrets"
run = ["git add .", "git commit -m {{usage.message | quote}}"]
usage = '''arg <message> default="Update secrets"'''

[tasks.deploy-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy configuration to a machine using nixos-anywhere"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = [
	'cd secrets && mise run decrypt-secrets',
	'''{{vars.nix_bin}} run github:nix-community/nixos-anywhere -- --flake '.?submodules=1#{{vars.sandbox1_name}}' --extra-files /tmp/{{vars.sandbox1_name}}/keys --disk-encryption-keys /tmp/zfs-secret.key ~/zfs-pass.txt root@nixos-vm''',
	'''sed -i '/^{{vars.sandbox1_ip}}/D' $USER/.ssh/known_hosts''',
]

[tasks.rebuild-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to vm"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.sandbox1_name}}' --target-host root@nixos-vm'''

[tasks.check-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for vm"
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.sandbox1_name}}' --target-host root@nixos-vm'''

[tasks.deploy-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy configuration to a machine using nixos-anywhere"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = [
	'cd secrets && mise run decrypt-secrets',
	'''{{vars.nix_bin}} run github:nix-community/nixos-anywhere -- --flake '.?submodules=1#{{vars.homelab1_name}}' --extra-files /tmp/{{vars.homelab1_name}}/keys --disk-encryption-keys /tmp/zfs-secret.key /tmp/{{vars.homelab1_name}}-zroot-key -i ~/.ssh/vm root@nixos-live.lan''',
	'''sed -i '/^{{vars.homelab1_ip}}/D' $USER/.ssh/known_hosts''',
]

[tasks.build-cloud-vhd]
vars._.file = "secrets/mise_vars.txt"
description = "Build configuration to a VHD image using nixos-rebuild"
run = [
	'''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- build-image --image-variant {{vars.cloud1_variant}} --flake .?submodules=1#{{vars.cloud1_name}}''',
	'ln -sf $(readlink ./result | sed "s|^/nix|$HOME/.nix|") ./result',
	'cd secrets && mise run decrypt-secrets',
	'cp -L result/*.vhd ./{{vars.cloud1_name}}.vhd',
	'./tools/inject-ssh-vhd.sh ./{{vars.cloud1_name}}.vhd /tmp/{{vars.cloud1_name}}-ssh-key',
]

[tasks.deploy-cloud-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy Cloud VM from generated VHD"
run = '''./tools/deploy-{{vars.cloud1_variant}}-vm.sh {{vars.cloud1_rg}} {{vars.cloud1_name}} ./{{vars.cloud1_name}}.vhd {{vars.cloud1_storage_account}} vhds'''

[tasks.rebuild-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to homelab"
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.homelab1_name}}' --target-host root@{{vars.homelab1_name}} --build-host root@{{vars.homelab1_name}}'''

[tasks.check-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for homelab"
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.homelab1_name}}' --target-host root@{{vars.homelab1_name}}'''

[tasks."flake:update"]
alias = "up"
run = "{{vars.nix_bin}} flake update"

[tasks."nix:bare"]
alias = "nix"
run = "{{vars.nix_bin}} "

[tasks."nix:bin"]
alias = "nixbin"
run = "{{vars.nix_chroot_bin}}/{{usage.all|join(sep=' ')}}"
usage = '''arg <all...>'''

[tasks.build-iso]
alias = "iso"
shell = "zsh -c"
run = [
	"rm -f result",
	'cd secrets && mise run decrypt-secrets && git add live-ssh-key',
	"{{vars.nix_bin}} build $'.?submodules=1#nixosConfigurations.nixos-live.config.system.build.isoImage'",
	'cd secrets && git restore --staged live-ssh-key && rm live-ssh-key',
	'ln -sf ${$(readlink ./result):s|/nix|~/.nix} ./result',
	'''sed -i '/^192./D' $USER/.ssh/known_hosts''',
]

[tasks.rebuild-cloud]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to cloud1"
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.cloud1_name}}' --target-host root@{{vars.cloud1_name}}'''

[tasks.check-cloud]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for cloud1"
interactive = true
run = '''{{vars.nix_bin}} run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.cloud1_name}}' --target-host root@{{vars.cloud1_name}}'''