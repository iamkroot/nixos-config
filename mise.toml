[tasks.fmt]
description = "Run nixfmt"
run = "nix-shell -p nixfmt-tree --run \"treefmt ${@:-.}\""

[tasks."dns:push-router"]
vars._.file = "secrets/mise_vars.txt"
description = "Push dnsmasq address entries to OpenWrt (derived from Nix)"
run = './tools/dns-push-router.sh "${@:-router}"'

[tasks."dns:sync-porkbun"]
vars._.file = "secrets/mise_vars.txt"
description = "Sync DNS records to Porkbun (derived from Nix)"
run = '''
eval "$(mise -C secrets run decrypt-porkbun)"
./tools/dns-sync-porkbun.sh
'''

[tasks."secret:renc"]
dir = "{{ config_root }}"
alias = "renc"
description = "Run vaultix renc"
run = [
	"nix run $'.?submodules=1#vaultix.app.x86_64-linux.renc'",
	"git -C secrets add cache",
]

[tasks."secret:edit"]
dir = "{{ config_root }}"
alias = "sedit"
run = "mise -C secrets secret:edit"

[tasks."secret:decrypt"]
alias = "decrypt"
quiet = true
raw = true
run = "mise -C secrets decrypt-secret"

[tasks.commit-secrets]
dir = "secrets"
run = ["git add .", "git commit -m {{usage.message | quote}}"]
usage = '''arg <message> default="Update secrets"'''

[tasks.deploy-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy configuration to a machine using nixos-anywhere"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = [
	'cd secrets && mise run decrypt-secrets',
	'''nix run github:nix-community/nixos-anywhere -- --flake '.?submodules=1#{{vars.sandbox1_name}}' --extra-files /tmp/{{vars.sandbox1_name}}/keys --disk-encryption-keys /tmp/zfs-secret.key ~/zfs-pass.txt root@nixos-vm''',
	'''sed -i '/^{{vars.sandbox1_ip}}/D' $USER/.ssh/known_hosts''',
]

[tasks.rebuild-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to vm"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.sandbox1_name}}' --target-host root@nixos-vm'''

[tasks.check-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for vm"
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.sandbox1_name}}' --target-host root@nixos-vm'''

[tasks.deploy-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy configuration to a machine using nixos-anywhere"
# TODO: 1. ssh-keygen a keypair to /tmp, 2. decrypt zfs passphrase via age, 3. Provide password via env.SSHPASS
interactive = true
run = [
	'mise -C secrets run decrypt-secrets',
	'''nix run github:nix-community/nixos-anywhere -- --flake '.?submodules=1#{{vars.homelab1_name}}' --extra-files /tmp/{{vars.homelab1_name}}/keys --disk-encryption-keys /tmp/zfs-secret.key /tmp/{{vars.homelab1_name}}-zroot-key -i ~/.ssh/vm root@nixos-live.lan''',
	'''sed -i '/^{{vars.homelab1_ip}}/D' $USER/.ssh/known_hosts''',
]

[tasks.build-cloud-vhd]
vars._.file = "secrets/mise_vars.txt"
description = "Build configuration to a VHD image using nixos-rebuild"
run = [
	'rm -rf result',
	# TODO: Pass --print-store-paths and directly get that path instead of going through result
	'''nix run nixpkgs#nixos-rebuild -- build-image --image-variant {{vars.cloud1_variant}} --flake .?submodules=1#{{vars.cloud1_name}}''',
	'mise -C secrets run decrypt-secrets',
	'cp -L result/*.vhd ./{{vars.cloud1_name}}.vhd',
	'./tools/inject-ssh-vhd.sh ./{{vars.cloud1_name}}.vhd /tmp/{{vars.cloud1_name}}-ssh-key',
]

[tasks.deploy-cloud-vm]
vars._.file = "secrets/mise_vars.txt"
description = "Deploy Cloud VM from generated VHD"
run = '''DISK_SIZE_GB=64 ./tools/deploy-{{vars.cloud1_variant}}-vm.sh {{vars.cloud1_rg}} {{vars.cloud1_name}} ./{{vars.cloud1_name}}.vhd {{vars.cloud1_storage_account}} vhds'''

[tasks.rebuild-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to homelab"
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.homelab1_name}}' --target-host root@{{vars.homelab1_name}} --build-host root@{{vars.homelab1_name}} --max-jobs auto'''

[tasks.check-homelab]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for homelab"
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.homelab1_name}}' --target-host root@{{vars.homelab1_name}} --build-host root@{{vars.homelab1_name}} --max-jobs auto'''

[tasks."flake:update"]
alias = "up"
run = "nix flake update"

[tasks.build-iso]
alias = "iso"
shell = "zsh -c"
run = [
	"rm -f result",
	'mise -C secrets run decrypt-secrets && git add live-ssh-key',
	"nix build $'.?submodules=1#nixosConfigurations.nixos-live.config.system.build.isoImage'",
	'cd secrets && git restore --staged live-ssh-key && rm live-ssh-key',
	'''sed -i '/^192./D' $USER/.ssh/known_hosts''',
]

[tasks.rebuild-cloud]
vars._.file = "secrets/mise_vars.txt"
description = "Invoke nixos-rebuild remotely to cloud1"
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- switch --flake '.?submodules=1#{{vars.cloud1_name}}' --target-host root@{{vars.cloud1_name}}'''

[tasks.check-cloud]
vars._.file = "secrets/mise_vars.txt"
description = "Dry-activate nixos-rebuild remotely for cloud1"
interactive = true
run = '''nix run nixpkgs#nixos-rebuild -- dry-activate --flake '.?submodules=1#{{vars.cloud1_name}}' --target-host root@{{vars.cloud1_name}}'''